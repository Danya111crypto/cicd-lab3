name: Conditional Environment Deployment

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'

jobs:
  build-and-verify:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --ci

      - name: Build application
        run: npm run build

  deploy-staging:
    name: Deploy to Staging (develop)
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging-cicd-lab3.onrender.com

    steps:
      - name: Deploy application to Staging environment
        run: |
          echo "Deploying commit ${{ github.sha }} from branch develop to Staging..."
          echo "Staging deployment completed successfully."

  deploy-production:
    name: Deploy to Production (Release Tag on main)
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://cicd-lab3.onrender.com

    steps:
      - name: Checkout full history to verify branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify that release tag belongs to main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Error: Release tag must point to a commit in the main branch!"
            exit 1
          fi
          echo "Verified: Tag ${{ github.ref_name }} is on main branch."

      - name: Trigger Production deployment on Render
        run: |
          curl -f -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Production deployment triggered for release ${{ github.ref_name }}"
