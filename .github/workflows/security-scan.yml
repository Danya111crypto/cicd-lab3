name: DevSecOps Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Vulnerability Audit (npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit for production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate full dependency audit report
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload dependency audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report-${{ github.run_number }}
          path: npm-audit-report.json
          retention-days: 14

  container-security-scan:
    name: Docker Image Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: docker build -t cicd-lab3:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cicd-lab3:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Generate Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cicd-lab3:scan'
          format: 'json'
          output: 'trivy-report.json'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report-${{ github.run_number }}
          path: trivy-report.json
          retention-days: 14
